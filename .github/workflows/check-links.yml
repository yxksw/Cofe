name: Check Friend Links

on:
    schedule:
        # 每天北京时间 08:00 运行 (UTC 00:00)
        - cron: "0 0 * * *"
    workflow_dispatch:

jobs:
    check-links:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: |
                  npm install -g tsx
                  npm install p-limit

            - name: Check friend links
              run: npx tsx scripts/check-links.ts
              timeout-minutes: 10

            - name: Check for changes
              id: check_changes
              run: |
                  if git diff --quiet data/friends.ts; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                  else
                    echo "changed=true" >> $GITHUB_OUTPUT
                  fi

            - name: Commit and push changes
              if: steps.check_changes.outputs.changed == 'true'
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git add data/friends.ts
                  git commit -m "chore: update friend links status [skip ci]"
                  git push

            - name: Trigger Vercel Deploy Hook
              if: steps.check_changes.outputs.changed == 'true' && vars.VERCEL_DEPLOY_HOOK != ''
              run: |
                  curl -X POST "${{ vars.VERCEL_DEPLOY_HOOK }}"
