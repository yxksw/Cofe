<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker 内联测试</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🔍 Tracker 内联测试</h1>
    <div id="log" class="log">初始化...</div>

    <script>
        const log = document.getElementById('log');
        
        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? 'green' : type === 'error' ? 'red' : 'black';
            log.innerHTML += `[${timestamp}] <span style="color: ${color}">${message}</span>\n`;
        }

        addLog('🚀 页面加载开始');
        addLog(`📍 当前路径: ${location.pathname}`);
    </script>

    <!-- 直接内联 tracker 代码，不依赖外部文件 -->
    <script>
        (function() {
            const WORKER_URL = 'https://cf-umami-cofe.050815.xyz';
            const SEND_ENDPOINT = WORKER_URL + '/send';
            
            let lastPathname = null;
            
            function sendPageView() {
                try {
                    const pathname = location.pathname || '/';
                    
                    if (lastPathname === pathname) return;
                    lastPathname = pathname;
                    
                    const data = JSON.stringify({ pathname: pathname });
                    
                    addLog(`📤 准备发送: ${pathname}`);
                    
                    if (navigator.sendBeacon) {
                        try {
                            const blob = new Blob([data], { type: 'application/json' });
                            const result = navigator.sendBeacon(SEND_ENDPOINT, blob);
                            if (result) {
                                addLog('✅ 通过 sendBeacon 发送成功', 'success');
                                return;
                            } else {
                                addLog('⚠️ sendBeacon 返回 false');
                            }
                        } catch (e) {
                            addLog(`⚠️ sendBeacon 失败: ${e.message}`);
                        }
                    }
                    
                    fetch(SEND_ENDPOINT, {
                        method: 'POST',
                        headers: { 'content-type': 'application/json' },
                        body: data,
                        keepalive: true,
                        mode: 'cors',
                        credentials: 'omit'
                    }).then(r => r.json()).then(data => {
                        addLog(`✅ 通过 fetch 发送成功: ${JSON.stringify(data)}`, 'success');
                    }).catch(err => {
                        addLog(`❌ fetch 失败: ${err.message}`, 'error');
                    });
                } catch (e) {
                    addLog(`❌ 错误: ${e.message}`, 'error');
                }
            }
            
            // 立即发送
            sendPageView();
            
            // 监听路由变化
            const originalPushState = history.pushState;
            history.pushState = function() {
                const result = originalPushState.apply(this, arguments);
                addLog('🔄 检测到路由变化 (pushState)');
                sendPageView();
                return result;
            };
            
            addLog('✅ Tracker 初始化完成');
        })();
    </script>

    <div style="margin-top: 30px;">
        <button onclick="testNavigation()">🔄 测试路由变化</button>
        <button onclick="checkWorker()">📊 查询浏览量</button>
    </div>

    <script>
        function testNavigation() {
            addLog('🔄 测试导航到 /test-page-2');
            history.pushState({}, '', '/test-page-2');
        }
        
        async function checkWorker() {
            addLog('📊 查询浏览量...');
            try {
                const response = await fetch('https://cf-umami-cofe.050815.xyz/share?pathname=%2Ftest-tracker-inline.html');
                const data = await response.json();
                addLog(`📈 浏览量: ${data.views}`, 'success');
            } catch (e) {
                addLog(`❌ 查询失败: ${e.message}`, 'error');
            }
        }
    </script>
</body>
</html>
