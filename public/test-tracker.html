<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker.js 测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .log {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            font-size: 14px;
        }
        button:hover { background: #0056b3; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>🔍 Tracker.js 诊断工具</h1>
    
    <div>
        <label>Worker URL:</label>
        <input type="text" id="worker-url" value="https://cf-umami-cofe.050815.xyz" style="width: 100%; padding: 8px; margin: 10px 0;">
    </div>
    
    <div>
        <label>测试路径:</label>
        <input type="text" id="test-path" value="/blog/test-tracker-page" style="width: 100%; padding: 8px; margin: 10px 0;">
    </div>
    
    <div style="margin: 20px 0;">
        <button onclick="checkTracker()">🔍 检查 Tracker 状态</button>
        <button onclick="manualSend()">📤 手动发送数据</button>
        <button onclick="testWithBeacon()">📡 使用 sendBeacon</button>
        <button onclick="testWithFetch()">🌐 使用 Fetch</button>
        <button onclick="clearLog()">🗑️ 清除日志</button>
    </div>
    
    <div id="log-output" class="log">等待测试开始...</div>
    
    <!-- 加载 tracker.js -->
    <script src="https://cf-umami-cofe.050815.xyz/tracker.js" defer></script>
    
    <script>
        const WORKER_URL = 'https://cf-umami-cofe.050815.xyz';
        
        function log(message, type = 'info') {
            const output = document.getElementById('log-output');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? 'green' : type === 'error' ? 'red' : 'black';
            output.innerHTML += `<span style="color: ${color}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
            console.log(`[Tracker Test] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('log-output').innerHTML = '';
        }
        
        // 检查 tracker.js 状态
        function checkTracker() {
            clearLog();
            log('🔍 检查 Tracker.js 状态...');
            
            // 检查脚本是否加载
            const scripts = document.querySelectorAll('script');
            let trackerFound = false;
            scripts.forEach(script => {
                if (script.src && script.src.includes('tracker.js')) {
                    trackerFound = true;
                    log(`✅ Tracker.js 已加载: ${script.src}`, 'success');
                    log(`📊 加载状态: ${script.readyState || 'complete'}`);
                }
            });
            
            if (!trackerFound) {
                log('❌ Tracker.js 未找到', 'error');
                return;
            }
            
            // 检查全局变量
            log('🔍 检查全局变量...');
            log(`navigator.sendBeacon: ${typeof navigator.sendBeacon}`);
            log(`document.currentScript: ${document.currentScript ? '存在' : '不存在'}`);
            
            // 检查是否有请求被拦截
            log('🔍 检查网络请求拦截...');
        }
        
        // 手动发送数据
        async function manualSend() {
            clearLog();
            const workerUrl = document.getElementById('worker-url').value || WORKER_URL;
            const testPath = document.getElementById('test-path').value || '/blog/test-page';
            
            log(`🚀 手动发送数据到: ${workerUrl}/send`);
            log(`📍 路径: ${testPath}`);
            
            try {
                const response = await fetch(`${workerUrl}/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ pathname: testPath })
                });
                
                const data = await response.json();
                log(`📡 响应状态: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');
                log(`📦 响应数据: ${JSON.stringify(data)}`);
                
                if (data.ok) {
                    log('✅ 数据发送成功', 'success');
                }
            } catch (error) {
                log(`❌ 发送失败: ${error.message}`, 'error');
            }
        }
        
        // 使用 sendBeacon 发送
        function testWithBeacon() {
            clearLog();
            const workerUrl = document.getElementById('worker-url').value || WORKER_URL;
            const testPath = document.getElementById('test-path').value || '/blog/test-page';
            
            log(`📡 使用 sendBeacon 发送数据`);
            log(`📍 路径: ${testPath}`);
            
            if (!navigator.sendBeacon) {
                log('❌ 浏览器不支持 sendBeacon', 'error');
                return;
            }
            
            const data = JSON.stringify({ pathname: testPath });
            const blob = new Blob([data], { type: 'application/json' });
            const url = `${workerUrl}/send`;
            
            log(`🚀 发送 to: ${url}`);
            const result = navigator.sendBeacon(url, blob);
            
            if (result) {
                log('✅ sendBeacon 返回 true (已加入发送队列)', 'success');
            } else {
                log('❌ sendBeacon 返回 false (发送失败)', 'error');
            }
        }
        
        // 使用 fetch 发送
        async function testWithFetch() {
            clearLog();
            const workerUrl = document.getElementById('worker-url').value || WORKER_URL;
            const testPath = document.getElementById('test-path').value || '/blog/test-page';
            
            log(`🌐 使用 Fetch 发送数据`);
            log(`📍 路径: ${testPath}`);
            
            try {
                const response = await fetch(`${workerUrl}/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ pathname: testPath }),
                    keepalive: true,
                    mode: 'cors',
                    credentials: 'omit'
                });
                
                log(`📡 响应状态: ${response.status}`, response.ok ? 'success' : 'error');
                
                const text = await response.text();
                log(`📦 响应内容: ${text}`);
            } catch (error) {
                log(`❌ 请求失败: ${error.message}`, 'error');
            }
        }
        
        // 监听 fetch 请求
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            const url = args[0];
            if (typeof url === 'string' && url.includes('cf-umami-cofe.050815.xyz')) {
                log(`📡 [拦截] Fetch 请求: ${url}`);
            }
            return originalFetch.apply(this, args);
        };
        
        // 监听 sendBeacon
        const originalSendBeacon = navigator.sendBeacon;
        navigator.sendBeacon = function(url, data) {
            if (typeof url === 'string' && url.includes('cf-umami-cofe.050815.xyz')) {
                log(`📡 [拦截] sendBeacon 请求: ${url}`);
            }
            return originalSendBeacon.apply(this, arguments);
        };
        
        // 页面加载完成后检查
        window.addEventListener('load', () => {
            setTimeout(() => {
                log('📋 页面加载完成');
                log(`📍 当前路径: ${location.pathname}`);
                log(`🔧 Worker URL: ${WORKER_URL}`);
                
                // 自动检查 tracker
                checkTracker();
            }, 1000);
        });
    </script>
</body>
</html>
