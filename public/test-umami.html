<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umami 测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 { color: #333; }
        .log {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }
        button:hover { background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>🔍 cf-umami 测试页面</h1>
    
    <div id="status">
        <h2>状态检查</h2>
        <div id="status-log" class="log">正在检查...</div>
    </div>

    <div id="actions">
        <h2>测试操作</h2>
        <button onclick="testTracker()">测试 Tracker 加载</button>
        <button onclick="testSend()">手动发送浏览数据</button>
        <button onclick="testShare()">测试 Share API</button>
        <button onclick="clearLog()">清除日志</button>
    </div>

    <div id="logs">
        <h2>日志输出</h2>
        <div id="log-output" class="log"></div>
    </div>

    <!-- 加载 cf-umami tracker.js -->
    <script src="https://cf-umami-cofe.050815.xyz/tracker.js" defer></script>

    <script>
        const WORKER_URL = 'https://cf-umami-cofe.050815.xyz';
        const TEST_PATHNAME = '/test-umami-page';

        function log(message, type = 'info') {
            const output = document.getElementById('log-output');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            output.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
            console.log(`[Umami Test] ${message}`);
        }

        function clearLog() {
            document.getElementById('log-output').innerHTML = '';
        }

        // 检查 tracker.js 是否加载
        function checkTracker() {
            const scripts = document.querySelectorAll('script');
            let trackerLoaded = false;
            scripts.forEach(script => {
                if (script.src && script.src.includes('tracker.js')) {
                    trackerLoaded = true;
                    log(`✅ Tracker 脚本已加载: ${script.src}`, 'success');
                }
            });
            if (!trackerLoaded) {
                log('❌ Tracker 脚本未找到', 'error');
            }
            return trackerLoaded;
        }

        // 测试手动发送
        async function testSend() {
            log('🚀 开始测试 /send 端点...');
            
            try {
                const response = await fetch(`${WORKER_URL}/send`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ pathname: TEST_PATHNAME })
                });
                
                log(`📡 响应状态: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    log('✅ 数据发送成功', 'success');
                } else {
                    const text = await response.text();
                    log(`❌ 发送失败: ${text}`, 'error');
                }
            } catch (error) {
                log(`❌ 请求错误: ${error.message}`, 'error');
            }
        }

        // 测试 Share API
        async function testShare() {
            log('🚀 开始测试 /share 端点...');
            
            try {
                const response = await fetch(
                    `${WORKER_URL}/share?pathname=${encodeURIComponent(TEST_PATHNAME)}`
                );
                
                log(`📡 响应状态: ${response.status} ${response.statusText}`);
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ 获取成功: ${JSON.stringify(data, null, 2)}`, 'success');
                } else {
                    const text = await response.text();
                    log(`❌ 获取失败: ${text}`, 'error');
                }
            } catch (error) {
                log(`❌ 请求错误: ${error.message}`, 'error');
            }
        }

        // 测试 Tracker
        function testTracker() {
            log('🔍 检查 Tracker 状态...');
            checkTracker();
            
            // 检查是否有 sendBeacon
            if (navigator.sendBeacon) {
                log('✅ 浏览器支持 sendBeacon API', 'success');
            } else {
                log('⚠️ 浏览器不支持 sendBeacon，将使用 fetch', 'info');
            }
            
            // 尝试手动触发
            log('🔄 尝试手动触发页面浏览...');
            if (typeof history !== 'undefined') {
                history.pushState({}, '', TEST_PATHNAME);
                setTimeout(() => {
                    history.pushState({}, '', '/test-umami.html');
                }, 1000);
            }
        }

        // 页面加载完成后检查
        window.addEventListener('load', () => {
            setTimeout(() => {
                const statusLog = document.getElementById('status-log');
                
                let status = '';
                
                // 检查 tracker.js
                const scripts = document.querySelectorAll('script');
                let trackerFound = false;
                scripts.forEach(script => {
                    if (script.src && script.src.includes('cf-umami-cofe.050815.xyz/tracker.js')) {
                        trackerFound = true;
                    }
                });
                
                if (trackerFound) {
                    status += '✅ tracker.js 已加载\n';
                } else {
                    status += '❌ tracker.js 未加载\n';
                }
                
                // 检查浏览器支持
                if (navigator.sendBeacon) {
                    status += '✅ sendBeacon API 可用\n';
                } else {
                    status += '⚠️ sendBeacon API 不可用\n';
                }
                
                // 显示 Origin 信息（用于调试 TRACKED_SITE_HOST）
                status += `\n📍 当前路径: ${location.pathname}\n`;
                status += `🌐 当前域名: ${location.hostname}\n`;
                status += `📤 Origin: ${location.origin}\n`;
                status += `🔧 Worker URL: ${WORKER_URL}\n`;
                status += `\n⚠️ 注意: cf-umami 的 TRACKED_SITE_HOST 必须设置为 "${location.hostname}"\n`;
                
                statusLog.textContent = status;
                
                log('页面加载完成，准备测试...');
                log(`当前 Origin: ${location.origin}`);
            }, 1000);
        });

        // 监听网络请求
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            const url = args[0];
            if (typeof url === 'string' && url.includes('cf-umami-cofe.050815.xyz')) {
                log(`📡 检测到请求: ${url}`);
            }
            return originalFetch.apply(this, args);
        };
    </script>
</body>
</html>
