<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker 加载测试</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; font-family: monospace; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🔍 Tracker 加载测试</h1>
    <div id="log" class="log">等待加载...</div>

    <!-- 加载 tracker-fixed.js -->
    <script src="/js/tracker-fixed.js" defer></script>

    <script>
        const log = document.getElementById('log');
        
        function addLog(message, type = 'info') {
            const color = type === 'success' ? 'green' : type === 'error' ? 'red' : 'black';
            log.innerHTML += `<div style="color: ${color}">${message}</div>`;
        }

        // 检查脚本加载
        window.addEventListener('load', () => {
            setTimeout(() => {
                const scripts = document.querySelectorAll('script');
                let trackerFound = false;
                
                scripts.forEach(script => {
                    if (script.src && script.src.includes('tracker-fixed.js')) {
                        trackerFound = true;
                        addLog(`✅ tracker-fixed.js 找到: ${script.src}`, 'success');
                        addLog(`📊 加载状态: ${script.readyState || 'complete'}`);
                    }
                });
                
                if (!trackerFound) {
                    addLog('❌ tracker-fixed.js 未找到', 'error');
                }
                
                // 尝试直接测试 fetch
                addLog('🧪 测试直接 fetch...');
                fetch('https://cf-umami-cofe.050815.xyz/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pathname: '/test-page' })
                })
                .then(r => r.json())
                .then(data => addLog(`✅ Fetch 成功: ${JSON.stringify(data)}`, 'success'))
                .catch(e => addLog(`❌ Fetch 失败: ${e.message}`, 'error'));
            }, 2000);
        });
    </script>
</body>
</html>
