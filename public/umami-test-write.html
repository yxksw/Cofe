<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cf-umami 写入测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .log {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        button {
            padding: 12px 24px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #007bff;
            color: white;
            font-size: 16px;
        }
        button:hover { background: #0056b3; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>📝 cf-umami 写入测试</h1>
    
    <div>
        <label>Worker URL:</label>
        <input type="text" id="worker-url" value="https://cf-umami-cofe.050815.xyz" style="width: 100%; padding: 8px; margin: 10px 0;">
    </div>
    
    <div>
        <label>测试路径:</label>
        <input type="text" id="test-path" value="/blog/test-write-page" style="width: 100%; padding: 8px; margin: 10px 0;">
    </div>
    
    <div style="margin: 20px 0;">
        <button onclick="testDirectWrite()">🚀 直接测试写入</button>
        <button onclick="testWithTracker()">📡 使用 tracker.js 写入</button>
        <button onclick="queryViews()">📊 查询浏览量</button>
        <button onclick="clearLog()">🗑️ 清除日志</button>
    </div>
    
    <div id="log-output" class="log">点击按钮开始测试...</div>
    
    <!-- 加载 tracker.js -->
    <script src="https://cf-umami-cofe.050815.xyz/tracker.js" defer></script>
    
    <script>
        const WORKER_URL = 'https://cf-umami-cofe.050815.xyz';
        const TEST_PATH = '/blog/test-write-page';
        
        function log(message, type = 'info') {
            const output = document.getElementById('log-output');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? 'green' : type === 'error' ? 'red' : 'black';
            output.innerHTML += `<span style="color: ${color}">[${timestamp}] ${message}</span>\n`;
            output.scrollTop = output.scrollHeight;
            console.log(`[Test] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('log-output').innerHTML = '';
        }
        
        async function testDirectWrite() {
            clearLog();
            const workerUrl = document.getElementById('worker-url').value || WORKER_URL;
            const testPath = document.getElementById('test-path').value || TEST_PATH;
            
            log(`🚀 直接测试写入到: ${workerUrl}/send`);
            log(`📍 路径: ${testPath}`);
            
            try {
                // 发送 5 次请求
                for (let i = 1; i <= 5; i++) {
                    log(`📤 发送请求 ${i}/5...`);
                    
                    const response = await fetch(`${workerUrl}/send`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Origin': window.location.origin
                        },
                        body: JSON.stringify({ pathname: testPath })
                    });
                    
                    const data = await response.json();
                    log(`📡 响应: ${JSON.stringify(data)}`, response.ok ? 'success' : 'error');
                    
                    // 等待 500ms
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                log('✅ 所有请求发送完成');
                
                // 等待 2 秒后查询
                log('⏳ 等待 2 秒后查询...');
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                await queryViews();
                
            } catch (error) {
                log(`❌ 错误: ${error.message}`, 'error');
            }
        }
        
        async function testWithTracker() {
            clearLog();
            const testPath = document.getElementById('test-path').value || TEST_PATH;
            
            log('📡 使用 tracker.js 测试写入');
            log(`📍 路径: ${testPath}`);
            
            // 检查 tracker.js 是否加载
            const scripts = document.querySelectorAll('script');
            let trackerLoaded = false;
            scripts.forEach(script => {
                if (script.src && script.src.includes('tracker.js')) {
                    trackerLoaded = true;
                    log(`✅ tracker.js 已加载: ${script.src}`, 'success');
                }
            });
            
            if (!trackerLoaded) {
                log('❌ tracker.js 未加载', 'error');
                return;
            }
            
            // 使用 history.pushState 触发 tracker
            log('🔄 触发 history.pushState...');
            history.pushState({}, '', testPath);
            
            log('⏳ 等待 3 秒...');
            await new Promise(resolve => setTimeout(resolve, 3000));
            
            // 恢复路径
            history.pushState({}, '', '/umami-test-write.html');
            
            log('✅ 触发完成');
            
            // 等待 2 秒后查询
            log('⏳ 等待 2 秒后查询...');
            await new Promise(resolve => setTimeout(resolve, 2000));
            
            await queryViews();
        }
        
        async function queryViews() {
            const workerUrl = document.getElementById('worker-url').value || WORKER_URL;
            const testPath = document.getElementById('test-path').value || TEST_PATH;
            
            log(`📊 查询浏览量: ${testPath}`);
            
            try {
                const response = await fetch(
                    `${workerUrl}/share?pathname=${encodeURIComponent(testPath)}`
                );
                
                const data = await response.json();
                log(`📦 响应: ${JSON.stringify(data, null, 2)}`);
                
                if (data.views > 0) {
                    log(`✅ 浏览量: ${data.views}`, 'success');
                } else {
                    log(`⚠️ 浏览量为 0，数据可能未写入`, 'error');
                }
            } catch (error) {
                log(`❌ 查询错误: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
